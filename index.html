<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Points</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fb;
      padding: 30px 15px;
    }

    .box {
      background: white;
      padding: 25px;
      margin: 15px auto;
      border-radius: 15px;
      max-width: 400px;
    }

    button {
      padding: 12px 25px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>⭐ Nova Points</h1>

  <div class="box">
    <p>Your Balance</p>
    <h2 id="balance">0 Points</h2>
  </div>

  <h2>Choose a Package</h2>

  <div class="box">
    <h3>100 Points</h3>
    <button onclick="addPoints(100)">Select</button>
  </div>

  <div class="box">
    <h3>500 Points</h3>
    <button onclick="addPoints(500)">Select</button>
  </div>

  <div class="box">
    <h3>1,000 Points</h3>
    <button onclick="addPoints(1000)">Select</button>
  </div>

  <script>
    let balance = 0;

    function addPoints(points) {
      balance += points;
      document.getElementById("balance").textContent =
        balance.toLocaleString() + " Points";

      alert(points.toLocaleString() + " demo points added!");
    }
  </script>

</body>
</html>
