<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova Coins</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 30px 20px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .balance {
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin: 25px 0;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .coins {
      font-size: 32px;
      font-weight: bold;
    }

    .package {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>🪙 Nova Coins</h1>
    <p>Welcome to Nova Coins</p>

    <div class="balance">
      <div>Your Balance</div>
      <div class="coins">0 Coins</div>
    </div>

    <h2>Choose a Package</h2>

    <div class="package">
      <h3>100 Coins</h3>
      <p>Demo package</p>
      <button onclick="alert('Purchase option selected')">
        Select
      </button>
    </div>

    <div class="package">
      <h3>500 Coins</h3>
      <p>Demo package</p>
      <button onclick="alert('Purchase option selected')">
        Select
      </button>
    </div>

    <div class="package">
      <h3>1,000 Coins</h3>
      <p>Demo package</p>
      <button onclick="alert('Purchase option selected')">
        Select
      </button>
    </div>

  </div>
</body>
</html>
